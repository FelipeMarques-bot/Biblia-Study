{% load static %}
{# Bottom Tab Bar — mobile only, fixed, 7 tabs #}
<nav class="fixed bottom-0 left-0 right-0 z-50 hide-desktop safe-bottom bg-dark-surface/95 backdrop-blur-xl border-t border-dark-border"
     style="padding-bottom: env(safe-area-inset-bottom, 0px);">
  <div class="flex items-center justify-between py-1 px-0.5 max-w-lg mx-auto">
    {# Home #}
    <a href="{% url 'dashboard' %}" class="bottom-tab {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>

      <span class="text-[8px] font-medium">Home</span>
    </a>

    {# Trilhas #}
    <a href="{% url 'lista_trilhas' %}" class="bottom-tab {% if request.resolver_match.url_name == 'lista_trilhas' or request.resolver_match.url_name == 'mapa_trilha' %}active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>

    </a>

    <a href="{% url 'desafio_diario' %}" class="bottom-tab {% if request.resolver_match.url_name == 'desafio_diario' %}active{% endif %}">
      <div class="w-11 h-11 -mt-3 rounded-full flex items-center justify-center bg-neon-orange"
           style="box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);">
        <svg class="w-5 h-5 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <span class="text-[8px] font-medium -mt-0.5">Desafio</span>

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
