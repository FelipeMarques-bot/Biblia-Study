services:
  - type: web
    name: biblia-study
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python -c "import os; os.environ.get('DJANGO_SUPERUSER_USERNAME') and os.system('python manage.py createsuperuser --noinput') or print('Skipping createsuperuser: env vars not set')"
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gemini-2.5-flash"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: biblia-db
          property: connectionString
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: biblia-db
    plan: free
    databaseName: biblia_db
