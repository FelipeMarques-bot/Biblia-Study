name: Keepalive

on:
  schedule:
    # A cada 12 min (menor que os ~15 min de idle do plano free do Render)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Manter a instância acordada
    runs-on: ubuntu-latest
    steps:
      - name: Ping na aplicação
        run: |
          URL="${{ vars.APP_URL || 'https://biblia-study.onrender.com' }}"
          URL="${URL%/}/ping/"
          echo "Pingando $URL"
          curl -sSf -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" "$URL" || true